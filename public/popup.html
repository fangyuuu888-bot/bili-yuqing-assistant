<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B站舆情分析助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 320px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6fa; }
    .header { background: linear-gradient(135deg, #fb7299, #f25d8e); padding: 16px; color: #fff; }
    .header h1 { font-size: 16px; margin-bottom: 4px; }
    .header p { font-size: 12px; opacity: 0.9; }
    .status { padding: 12px 16px; background: #fff; border-bottom: 1px solid #f0f0f0; }
    .status-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
    .status-dot.active { background: #2ed573; }
    .actions { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #fb7299, #f25d8e); color: #fff; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(251, 114, 153, 0.3); }
    .btn-secondary { background: #f1f2f6; color: #2f3640; }
    .btn-profile { background: linear-gradient(135deg, #3742fa, #2f35c3); color: #fff; }
    .btn-profile:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(55, 66, 250, 0.3); }
    .btn-secondary:hover { background: #e8ecf3; }
    .footer { padding: 8px 16px 12px; font-size: 11px; color: #999; text-align: center; }
    .data-count { font-size: 11px; color: #2ed573; margin-top: 4px; }
    .data-count.empty { color: #999; }
    .link-input { width: 100%; height: 50px; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; resize: none; font-family: inherit; }
    .link-btn { width: 100%; margin-top: 6px; background: linear-gradient(135deg, #00b894, #00cec9); color: #fff; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📊 B站舆情分析助手</h1>
    <p>采集B站评论数据，AI情感分析</p>
  </div>
  <div class="status" id="statusBar">
    <div class="status-row">
      <div class="status-dot" id="platformDot"></div>
      <span id="platformName">检测中...</span>
    </div>
    <div class="data-count empty" id="dataCount">暂无采集数据</div>
  </div>
  <div style="padding: 12px 16px; background: #fff; border-bottom: 1px solid #f0f0f0;">
    <textarea id="linkInput" class="link-input" placeholder="粘贴B站视频链接...&#10;如: https://www.bilibili.com/video/BV1xx..."></textarea>
    <button class="btn link-btn" id="linkBtn">
      <span>🔗</span> 解析链接并采集
    </button>
  </div>
  <div class="actions">
    <button class="btn btn-primary" id="captureBtn">
      <span>📥</span> 采集当前页面评论
    </button>
    <button class="btn btn-profile" id="profileBtn" style="display:none;">
      <span>👤</span> 采集用户画像
    </button>
    <button class="btn btn-secondary" id="dashboardBtn">
      <span>📈</span> 打开分析仪表盘
    </button>
  </div>
  <div class="footer">B站专用舆情分析工具</div>
  <script src="popup.js"></script>
</body>
</html>
